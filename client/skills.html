<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Skills - SkillSwap</title>

    <link rel="stylesheet" href="css/skills.css">
</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Skill<span>Swap</span>
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="skills.html">My Skills</a>
            <a href="matches.html">Matches</a>
            <a href="requests.html">Requests</a>
            <a href="profile.html">Profile</a>
        </div>

        <button id="logoutBtn" class="logout-btn">
            Logout
        </button>

    </nav>


    <!-- Main -->

    <main class="skills-container">

        <div class="page-header">

            <p class="small-text">YOUR SKILLS</p>

            <h1>Build Your Skill Profile</h1>

            <p>
                Tell the community what you can teach
                and what you want to learn.
            </p>

        </div>


        <!-- Add Skill -->

        <section class="add-skill-card">

            <h2>Add a Skill</h2>

            <form id="skillForm">

                <div class="form-group">

                    <label for="skill">
                        Select Skill
                    </label>

                    <select id="skill" required>

                        <option value="">
                            Choose a skill
                        </option>

                        <option value="Java">
                            Java
                        </option>

                        <option value="Python">
                            Python
                        </option>

                        <option value="JavaScript">
                            JavaScript
                        </option>

                        <option value="React">
                            React
                        </option>

                        <option value="HTML & CSS">
                            HTML & CSS
                        </option>

                        <option value="SQL">
                            SQL
                        </option>

                        <option value="Graphic Design">
                            Graphic Design
                        </option>

                        <option value="Video Editing">
                            Video Editing
                        </option>

                        <option value="Public Speaking">
                            Public Speaking
                        </option>

                        <option value="Photography">
                            Photography
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="skillType">
                        I want to
                    </label>

                    <select id="skillType" required>

                        <option value="">
                            Select type
                        </option>

                        <option value="TEACH">
                            Teach this skill
                        </option>

                        <option value="LEARN">
                            Learn this skill
                        </option>

                    </select>

                </div>


                <button type="submit" class="add-btn">
                    + Add Skill
                </button>

            </form>

        </section>


        <!-- My Skills -->

        <section class="my-skills">

            <div class="skill-column">

                <h2>🎓 Skills I Can Teach</h2>

                <div id="teachSkills" class="skill-list">

                    <p class="empty-message">
                        No teaching skills added yet.
                    </p>

                </div>

            </div>


            <div class="skill-column">

                <h2>📚 Skills I Want to Learn</h2>

                <div id="learnSkills" class="skill-list">

                    <p class="empty-message">
                        No learning skills added yet.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <script src="js/skills.js"></script>

</body>

</html>
